server {
    listen 80;
    listen 443 ssl;
    server_name www.sunyuanling.com;
    root H:/web_project;
    index index.php index.html index.htm;

    # SSL配置
    ssl_certificate ssl/www.sunyuanling.com/fullchain.pem;
    ssl_certificate_key ssl/www.sunyuanling.com/privkey.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;
    ssl_prefer_server_ciphers on;

# 全局CORS配置（允许所有来源）
add_header Access-Control-Allow-Origin '*' always;
add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Token, X-Token-Refresh' always;
# 注意：使用通配符(*)时不能启用Allow-Credentials
# add_header Access-Control-Allow-Credentials 'true' always;  # 需要注释掉这行
    # 核心优化：开放所有静态资源访问（排除动态脚本）
    location / {
        try_files $uri $uri/ =404;

        # 禁止直接执行PHP/Python等动态文件
        location ~ \.(php|py|jsp|asp)$ {
            deny all;
            return 403;
        }
    }

    # 合并后的API反向代理配置
    location /api/ {
        # 处理OPTIONS预检请求
         if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Token, X-Token-Refresh';
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
    }

        proxy_pass http://127.0.0.1:2233/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;

        # 确保传递CORS头到浏览器
        proxy_hide_header 'Access-Control-Allow-Origin';
        #add_header 'Access-Control-Allow-Origin' 'https://localhost:3002' always;
        add_header 'Access-Control-Allow-Origin' '*' always;
        #add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # WebSocket代理
    location /ws/chat {
    proxy_pass https://127.0.0.1:2234/chat;
    proxy_http_version 1.1;

    # 强制设置WebSocket升级头
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 即使客户端未发送，也强制声明为WebSocket
    proxy_set_header Sec-WebSocket-Version 13;
    proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;

    # 禁用缓冲
    proxy_buffering off;
}

    # 安全限制
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        deny all;
        return 404;
    }

    # 日志与错误页面
    access_log G:/BtSoft/wwwlogs/www.sunyuanling.com.log;
    error_log G:/BtSoft/wwwlogs/www.sunyuanling.com.error.log;
    error_page 404 /404.html;
}