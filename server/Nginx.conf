server {
    listen 80;
    listen 443 ssl;
    server_name www.sunyuanling.com;
    root H:/web_project;
    index index.php index.html index.htm;

    # SSL配置
    ssl_certificate ssl/www.sunyuanling.com/fullchain.pem;
    ssl_certificate_key ssl/www.sunyuanling.com/privkey.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;
    ssl_prefer_server_ciphers on;

# 全局CORS配置（允许所有来源）
add_header Access-Control-Allow-Origin '*' always;
add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Token, X-Token-Refresh' always;
# 注意：使用通配符(*)时不能启用Allow-Credentials
# add_header Access-Control-Allow-Credentials 'true' always;  # 需要注释掉这行
    # 核心优化：开放所有静态资源访问（排除动态脚本）
    location / {
        try_files $uri $uri/ =404;

        # 禁止直接执行PHP/Python等动态文件
        location ~ \.(php|py|jsp|asp)$ {
            deny all;
            return 403;
        }
    }

    # 合并后的API反向代理配置
    location /api/ {
        # 处理OPTIONS预检请求
         if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Token, X-Token-Refresh';
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
    }

        proxy_pass http://127.0.0.1:2233/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;

        # 确保传递CORS头到浏览器
        proxy_hide_header 'Access-Control-Allow-Origin';
        #add_header 'Access-Control-Allow-Origin' 'https://localhost:3002' always;
        add_header 'Access-Control-Allow-Origin' '*' always;
        #add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # WebSocket代理
    location /ws/chat {
    proxy_pass https://127.0.0.1:2234/chat;
    proxy_http_version 1.1;

    # 强制设置WebSocket升级头
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 即使客户端未发送，也强制声明为WebSocket
    proxy_set_header Sec-WebSocket-Version 13;
    proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;

    # 禁用缓冲
    proxy_buffering off;
}

    # 安全限制
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        deny all;
        return 404;
    }

    # 日志与错误页面
    access_log G:/BtSoft/wwwlogs/www.sunyuanling.com.log;
    error_log G:/BtSoft/wwwlogs/www.sunyuanling.com.error.log;
    error_page 404 /404.html;
}

#笔记本Nginx配置
server {
    listen 80;
    listen 443 ssl;
    server_name www.sunyuanling.com;
    root h:/web_project;
    index index.php index.html index.htm default.php default.htm default.html;

    # 错误页配置
    error_page 404 /404.html;
    # 你也可以启用其它错误页：
    # error_page 403 /403.html;
    # error_page 502 /502.html;

    # 强制HTTPS（如需启用，取消注释）
    # HTTP_TO_HTTPS_START
    # return 301 https://$host$request_uri;
    # HTTP_TO_HTTPS_END

    # SSL配置
    ssl_certificate ssl/www.sunyuanling.com/fullchain.pem;
    ssl_certificate_key ssl/www.sunyuanling.com/privkey.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    # 全局CORS配置（允许跨域访问）
    add_header Access-Control-Allow-Origin '*' always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Token, X-Token-Refresh' always;
    # 注意：如需支持 cookie，需指定源且启用下行（不能用 *）
    # add_header Access-Control-Allow-Credentials 'true' always;

    # 静态资源访问处理
    location / {
        try_files $uri $uri/ =404;

        # 禁止直接访问动态文件（例如PHP、Python）
        location ~ \.(php|py|jsp|asp)$ {
            deny all;
            return 403;
        }
    }

    # API接口反向代理，处理跨域及OPTIONS预检请求
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Token, X-Token-Refresh';
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass http://127.0.0.1:2233/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;

        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' '*' always;
        # add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # WebSocket代理
    location /ws/chat {
        proxy_pass https://127.0.0.1:2234/chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Version 13;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_buffering off;
    }

    # 清理缓存（如使用缓存策略）
    location ~ /purge(/.*) {
        proxy_cache_purge cache_one $1$is_args$args;
    }

    # 禁止访问敏感文件
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # Let's Encrypt 证书自动申请验证
    location ~ \.well-known {
        allow all;
    }

    # 包含其它配置文件（模块化）
    include proxy/www.sunyuanling.com/*.conf;
    include php/83.conf;
    include rewrite/www.sunyuanling.com/*.conf;
    include redirect/www.sunyuanling.com/*.conf;

    # 日志路径
    access_log E:/BtSoft/wwwlogs/www.sunyuanling.com.log;
    error_log E:/BtSoft/wwwlogs/www.sunyuanling.com.error.log;
}
